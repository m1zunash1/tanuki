<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交代たぬきツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero"><h1>交代たぬきツール</h1></header>

    <section class="panel">
      <div class="panel-head">
        <h2>入力</h2>
        <button id="addInput" class="add-input" type="button">＋ 文字列を追加</button>
      </div>
      <div id="inputList" class="input-list"></div>
    </section>

    <section class="panel">
      <h2>検索設定</h2>
      <div class="settings-grid">
        <fieldset class="setting-field">
          <legend>消し方</legend>
          <div class="segmented">
            <label><input type="radio" name="mode" value="sequence" checked /><span>文字列ごと</span></label>
            <label><input type="radio" name="mode" value="individual" /><span>個別消去</span></label>
          </div>
        </fieldset>
        <div class="length-field setting-box">
          <span>文字列の長さ</span>
          <div><input id="lengthMin" type="number" min="1" aria-label="文字列の最小の長さ" /><i>〜</i><input id="lengthMax" type="number" min="1" aria-label="文字列の最大の長さ" /></div>
        </div>
        <label class="check-field setting-box"><input id="omitRepeats" type="checkbox" /><span>繰り返し語を省く</span></label>
      </div>
    </section>

    <section class="panel">
      <h2>辞書選択</h2>
      <fieldset class="dictionary-field">
        <legend>削除後の単語（複数選択可）</legend>
        <div class="dict-groups"><div class="dict-group"><h3>日本語辞書</h3><div class="dict-grid">
          <label><input type="checkbox" name="dictionary" value="kobuta" checked /> 仔豚辞書</label>
          <label><input type="checkbox" name="dictionary" value="general" checked /> 一般語辞書</label>
          <label><input type="checkbox" name="dictionary" value="item" checked /> イラスト辞書</label>
        </div></div></div>
      </fieldset>
      <fieldset class="dictionary-field">
        <legend>候補文字列（未選択なら制限なし）</legend>
        <div class="dict-groups"><div class="dict-group"><h3>日本語辞書</h3><div class="dict-grid">
          <label><input type="checkbox" name="candidateDictionary" value="kobuta" /> 仔豚辞書</label>
          <label><input type="checkbox" name="candidateDictionary" value="general" /> 一般語辞書</label>
          <label><input type="checkbox" name="candidateDictionary" value="item" /> イラスト辞書</label>
        </div></div></div>
      </fieldset>
      <div class="search-row"><button id="searchButton" class="search" type="button">検索</button></div>
      <div id="error" class="error-box" role="alert"></div>
    </section>

    <section class="panel">
      <div class="results-header"><h2>結果</h2><div class="sort-row"><label for="sortOrder">並び順</label><select id="sortOrder"><option value="short">文字数が短い順</option><option value="long">文字数が長い順</option></select></div></div>
      <div class="summary-row"><div id="summary" class="summary-badge">まだ検索していません</div></div>
      <div id="results" aria-live="polite"><div class="empty">条件を入力して検索してください。</div></div>
      <button id="moreButton" class="more-button" type="button" hidden>さらに表示</button>
    </section>
  </main>

  <template id="inputTemplate">
    <article class="input-card">
      <div class="input-head"><span class="token-label"></span><button class="remove-input" type="button" aria-label="この文字列を削除"><span>×</span></button></div>
      <div class="input-body">
        <input class="token-input" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="12" placeholder="ひらがなを入力" />
        <label class="count-field"><span>含める数</span><span><input class="count-min" type="number" min="1" max="6" value="1" aria-label="最小含有数" /><i>〜</i><input class="count-max" type="number" min="1" max="6" value="3" aria-label="最大含有数" /></span></label>
      </div>
    </article>
  </template>
  <script src="dict-data.js"></script><script src="search-core.js"></script><script src="app.js"></script>
</body>
</html>
