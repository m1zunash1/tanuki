<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173f35" />
  <title>交代たぬきツール</title>
  <meta name="description" content="複数の文字列を消すと、それぞれ辞書語になる文字列を探します。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="leaf-mark" aria-hidden="true"></div>
      <h1>交代たぬきツール</h1>
    </header>

    <section class="search-card" aria-labelledby="search-title">
      <div class="section-heading">
        <h2 id="search-title">消す文字列</h2>
        <button id="addInput" class="add-button" type="button">＋ 文字列を増やす</button>
      </div>

      <div id="inputList" class="input-list"></div>

      <fieldset class="mode-picker">
        <legend>消し方</legend>
        <label><input type="radio" name="mode" value="sequence" checked /><span><b>文字列ごと</b></span></label>
        <label><input type="radio" name="mode" value="individual" /><span><b>個別消去</b></span></label>
      </fieldset>

      <div class="length-picker">
        <span>文字列の長さ</span>
        <div>
          <input id="lengthMin" type="number" min="1" placeholder="自由" aria-label="文字列の最小の長さ" />
          <i>〜</i>
          <input id="lengthMax" type="number" min="1" placeholder="自由" aria-label="文字列の最大の長さ" />
          <em>文字</em>
        </div>
      </div>

      <fieldset class="dictionary-picker">
        <legend>検索する辞書</legend>
        <label><input type="checkbox" name="dictionary" value="kobuta" checked /><span>仔豚辞書</span></label>
        <label><input type="checkbox" name="dictionary" value="general" checked /><span>一般語辞書</span></label>
        <label><input type="checkbox" name="dictionary" value="item" checked /><span>イラスト辞書</span></label>
      </fieldset>

      <div id="error" class="error" role="alert"></div>
      <button id="searchButton" class="search-button" type="button"><span>候補を探す</span><i aria-hidden="true">→</i></button>
    </section>

    <section class="results-section" aria-labelledby="results-title">
      <div class="section-heading results-heading">
        <h2 id="results-title">見つかった組み合わせ</h2>
        <span id="summary" class="summary">まだ検索していません</span>
      </div>
      <div id="results" class="results" aria-live="polite">
        <div class="empty-state"><span class="empty-leaf"></span><p>条件を入力して検索してください。</p></div>
      </div>
      <button id="moreButton" class="more-button" type="button" hidden>さらに表示</button>
    </section>
    <footer>交代たぬきツール</footer>
  </main>

  <template id="inputTemplate">
    <div class="input-row">
      <label class="token-field"><span class="token-label"></span><input class="token-input" inputmode="text" autocomplete="off" spellcheck="false" maxlength="12" /></label>
      <div class="count-field"><span>含める数</span><div><input class="count-min" type="number" min="1" max="6" value="1" aria-label="最小含有数" /><i>〜</i><input class="count-max" type="number" min="1" max="6" value="3" aria-label="最大含有数" /><em>個</em></div></div>
      <button class="remove-input" type="button" aria-label="この文字列を減らす">×</button>
    </div>
  </template>
  <script src="dict-data.js"></script>
  <script src="search-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
